name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-binaries:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: cc-pulse-windows-x64
            ext: .exe
          - os: ubuntu-latest
            asset: cc-pulse-linux-x64
            ext: ""
          - os: macos-latest
            asset: cc-pulse-macos-arm64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build single-file executable
        shell: bash
        run: |
          pip install pyinstaller
          pyinstaller --onefile --clean --paths src --name "${{ matrix.asset }}" \
            --hidden-import cc_pulse.archive \
            --hidden-import cc_pulse.env \
            --hidden-import cc_pulse.interactive \
            --hidden-import cc_pulse.net \
            --hidden-import cc_pulse.output \
            --hidden-import cc_pulse.probe \
            --hidden-import cc_pulse.store \
            --hidden-import cc_pulse.tui \
            src/cc_pulse/cli.py

      - name: Smoke-test binary
        shell: bash
        run: |
          "./dist/${{ matrix.asset }}${{ matrix.ext }}" --help
          "./dist/${{ matrix.asset }}${{ matrix.ext }}" env-check --no-db --json

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}${{ matrix.ext }}

  build-python-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and single-file .pyz
        run: |
          pip install build
          python -m build --wheel
          mkdir -p build_pyz
          cp -r src/cc_pulse build_pyz/cc_pulse
          python -m zipapp build_pyz -o dist/cc-pulse.pyz -m "cc_pulse.cli:main" -p "/usr/bin/env python3"
          python dist/cc-pulse.pyz --help
          python dist/cc-pulse.pyz env-check --no-db --json

      - name: Upload Python package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: |
            dist/*.whl
            dist/cc-pulse.pyz

  publish-release:
    needs: [build-binaries, build-python-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --title "CC-Pulse ${GITHUB_REF_NAME}" \
            --generate-notes
