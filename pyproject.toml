[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-pulse"
version = "0.1.0"
description = "Zero-dependency CLI health check, capability diagnostics, and authenticity guard for Claude Code / coding-agent LLM relays."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = ["claude-code", "llm", "api-health", "relay", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
cc-pulse = "check_ccswitch_health:main"

[tool.setuptools]
py-modules = [
    "check_ccswitch_health",
    "ccpulse_archive",
    "ccpulse_env",
    "ccpulse_net",
    "ccpulse_output",
    "ccpulse_probe",
    "ccpulse_store",
    "ccpulse_tui",
]
